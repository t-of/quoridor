<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2b2420">
  <meta name="description" content="9x9マスの盤で駒を進めるか壁を置いて相手を妨げ、先に向こう側の端へ着いたら勝ちの陣取りゲーム。">
  <title>quoridor — 2人で通路を作って陣地を目指す</title>

  <meta property="og:type" content="website">
  <meta property="og:site_name" content="quoridor">
  <meta property="og:title" content="quoridor — 2人で通路を作って陣地を目指す">
  <meta property="og:description" content="9x9マスの盤で駒を進めるか壁を置いて相手を妨げ、先に向こう側の端へ着いたら勝ちの陣取りゲーム。">
  <meta property="og:url" content="https://t-of.github.io/quoridor/">
  <meta property="og:image" content="https://t-of.github.io/quoridor/icons/og.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:locale" content="ja_JP">
  <meta name="twitter:card" content="summary_large_image">

  <!-- apple-mobile-web-app-status-bar-style は付けない（black-translucent だと iOS 26 で上部が隠れる） -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="quoridor">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
  <link rel="icon" type="image/png" sizes="32x32" href="./icons/favicon-32.png">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">

  <link rel="stylesheet" href="./webapp-kit/webapp-kit.css">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="app">
    <header class="bar">
      <h1 class="bar__title">quoridor</h1>
      <div class="bar__actions">
        <button class="pill" data-wak="install" hidden>アプリにする</button>
        <button class="pill" data-wak="share">共有</button>
      </div>
    </header>

    <section class="stage" id="stage">
      <div id="start" class="screen">
        <h2 class="title">quoridor</h2>
        <p class="sub">9×9の盤で先に向こう岸へ</p>
        <button class="big" data-start="cpu">CPU と対戦</button>
        <button class="big" data-start="pvp">2人で対戦（同じ端末）</button>
      </div>

      <div id="game" class="screen" hidden>
        <div class="info info--top">
          <span class="info__walls">壁 <b id="wallsTop">10</b></span>
          <span class="info__turn" id="turnLabel"></span>
        </div>

        <div class="board" id="board"></div>

        <div class="info info--bottom">
          <span class="info__walls">壁 <b id="wallsBottom">10</b></span>
          <span class="info__hint">隣り合う溝を2つタップで壁を置く</span>
        </div>
      </div>

      <div id="result" class="screen overlay" hidden>
        <h2 id="resultText"></h2>
        <button class="big" id="againBtn">もう一度</button>
      </div>
    </section>

    <footer class="credit">
      <a href="/">T.OF...</a> ／ <a href="https://t-of.github.io/contact/">問い合わせ</a>
    </footer>
  </main>

  <script src="./webapp-kit/webapp-kit.js"></script>
  <script src="./main.js"></script>
</body>
</html>
